  inc:function(el){ var p = byId(+el.dataset.id); if ((S.cart[p.id] || 0) < p.stock) S.cart[p.id] = (S.cart[p.id] || 0) + 1; else toast('No hay más unidades de ' + p.name); cartChanged(); },
  dec:function(el){ var id = +el.dataset.id; S.cart[id] = (S.cart[id] || 1) - 1; if (S.cart[id] <= 0) delete S.cart[id]; cartChanged(); },
  rm:function(el){ delete S.cart[+el.dataset.id]; cartChanged(); },
  cat:function(el, e){ toCatalog(el.dataset.cat, '', e); },
  catsub:function(el, e){ toCatalog(el.dataset.cat, el.dataset.sub, e); },
  'goto-all':function(el, e){ toCatalog('todos', '', e); },
  sub:function(el){ S.sub = el.dataset.sub; refreshGrids(); },
  'car-prev':function(){ var c = $('#car'); if (c && c._show) c._show(c._i() - 1); },
  'car-next':function(){ var c = $('#car'); if (c && c._show) c._show(c._i() + 1); },
  slide:function(el){ var c = $('#car'); if (c && c._show) c._show(+el.dataset.i); },
  'open-cart':openCart,
  'close-cart':closeCart,
  pay:tryPay,
  'wm-close':closeModal,
  'wm-pay':function(el){ el.disabled = true; el.textContent = 'Procesando…'; setTimeout(function(){ createOrder(true); }, 1100); },
  track:function(){
    S.trackCode = ($('#tcode').value || '').trim().toUpperCase(); S.justOrdered = null; $('#view').innerHTML = vRastrear();
    if (!DEMO_MODE && S.trackCode) Store.track(S.trackCode).then(function(){ if (S.route === 'rastrear') $('#view').innerHTML = vRastrear(); }).catch(function(){});
  },
  /* panel */
  login:function(){
    var em = ($('#pemail').value || '').trim().toLowerCase(), pw = $('#pin').value || '', er = $('#loginerr'), btn = $('#loginbtn');
    function fail(m){ er.textContent = m; er.hidden = false; if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; } }
    er.hidden = true;
    if (!em) return fail('Escribe tu correo.');
    if (!pw) return fail('Escribe tu contraseña.');
    if (DEMO_MODE) {
      if (em !== S.set.adminEmail.toLowerCase()) return fail('Ese correo no tiene acceso al panel.');
      if (pw.length < 6) return fail('La contraseña debe tener 6 o más caracteres.');
      S.authed = true; go(); return;
    }
    if (em !== S.set.adminEmail.toLowerCase()) return fail('Ese correo no tiene acceso al panel.');
    if (!window.MBFB) return fail('No se pudo conectar con el sistema de acceso. Recarga la página.');
    if (btn) { btn.disabled = true; btn.textContent = 'Entrando…'; }
    window.MBFB.signIn(em, pw).then(function(u){
      if ((u.email || '').toLowerCase() !== S.set.adminEmail.toLowerCase()) { window.MBFB.signOut(); return fail('Ese correo no tiene acceso al panel.'); }
      S.authed = true; Store.onAdmin(); go();
    }).catch(function(e){
      var c = (e && e.code) || '';
      fail(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'Correo o contraseña incorrectos.'
        : c === 'auth/invalid-email' ? 'Ese correo no es válido.'
        : c === 'auth/too-many-requests' ? 'Demasiados intentos. Espera unos minutos o usa “Olvidé mi contraseña”.'
        : c === 'auth/network-request-failed' ? 'Sin conexión. Revisa tu internet e intenta otra vez.'
        : c === 'auth/user-disabled' ? 'Este usuario está desactivado.'
        : 'No se pudo entrar. Intenta de nuevo.');
    });
  },
  forgot:function(){
    if (DEMO_MODE) { toast('En la versión publicada te llega un correo para crear una contraseña nueva.'); return; }
    var em = ($('#pemail') && $('#pemail').value || '').trim().toLowerCase();
    if (!em) { toast('Escribe tu correo arriba y vuelve a tocar “Olvidé mi contraseña”.'); return; }
    if (em !== S.set.adminEmail.toLowerCase()) { toast('Ese correo no tiene acceso al panel.'); return; }
    if (!window.MBFB) { toast('No se pudo conectar. Recarga la página.'); return; }
    window.MBFB.reset(em).then(function(){ toast('Listo. Revisa tu correo (mira también en spam) para crear la contraseña nueva.'); })
      .catch(function(){ toast('No se pudo enviar el correo. Intenta de nuevo en un momento.'); });
  },
  logout:function(){
    S.authed = false;
    if (!DEMO_MODE && window.MBFB) { try { window.MBFB.signOut(); } catch (e) {} Store.offAdmin(); }
    location.hash = '#inicio'; if (S.route === 'inicio') go();
  },
  tab:function(el){ S.tab = el.dataset.tab; if (S.tab === 'pedidos') S.newCount = 0; redrawTab(); window.scrollTo(0, 0); },
  ofilter:function(el){ S.orderFilter = el.dataset.k; redrawTab(); },
  range:function(el){ S.soldRange = el.dataset.k; redrawTab(); },
  adv:function(el){
    var o = findOrder(el.dataset.code), flow = FLOW[o.mode], i = flow.indexOf(o.status);
    if (i < flow.length - 1) { o.status = flow[i + 1]; toast(o.code + ' pasó a «' + o.status + '»'); }
    redrawTab();
  },
  'cancel-order':function(el){
    var o = findOrder(el.dataset.code); o.status = 'Cancelado';
    if (DEMO_MODE || o.stockApplied) o.lines.forEach(function(l){ byId(l.id).stock += l.qty; });
    toast(o.code + ' cancelado. El stock volvió al inventario.'); redrawTab();
  },
  'rm-examples':function(){
    var n = P.filter(function(p){ return p.ex && !p.alegraId; }).length; if (!n) return;
    if (!S.rmEx) { S.rmEx = true; redrawTab(); return; }
    for (var i = P.length - 1; i >= 0; i--) if (P[i].ex && !P[i].alegraId) P.splice(i, 1);
    S.cart = {}; S.rmEx = false; toast('Se quitaron ' + n + ' productos de ejemplo'); redrawTab();
  },
  'show-new':function(){ var n = 0; P.forEach(function(p){ if (p.fromAlegra && p.hidden) { p.hidden = false; n++; } }); toast(n + ' productos ahora se ven en la tienda'); redrawTab(); },
  stock:function(el){ if (Store.srv()) { toast('Alegra manda el inventario: cambia la cantidad en Alegra.'); return; } var p = byId(+el.dataset.id); p.stock = Math.max(0, p.stock + (+el.dataset.d)); $('#invbody').innerHTML = invRows(); $('#invtiles').innerHTML = invTiles(); },
  sync:function(){ alegraSendPending(); },
  chart:function(el){ S.chartMode = el.dataset.k; redrawTab(); },
  'slide-up':function(el){ moveSlide(el.dataset.id, -1); },
  'slide-dn':function(el){ moveSlide(el.dataset.id, 1); },
  'slide-rm':function(el){ S.slides = S.slides.filter(function(s){ return s.id !== el.dataset.id; }); toast('Imagen quitada de la portada'); redrawTab(); },
  'slide-add':function(){
    if (!S.adNew.img) { toast('Primero elige la imagen para computador'); return; }
    var secs = Math.max(2, Math.min(60, parseInt($('#ad-secs').value, 10) || 6));
    S.slides.push({ id:'ad' + (++S.adSeq), kind:'img', name:($('#ad-name').value || '').trim(), img:S.adNew.img, imgM:S.adNew.imgM, link:$('#ad-link').value, secs:secs, on:true });
    S.adNew = { img:'', imgM:'' }; toast('Imagen agregada a la portada · ' + secs + ' segundos'); redrawTab();
  },
  'prod-add':function(){
    var g = function(id){ return ($('#' + id).value || '').trim(); }, num = function(id){ return parseInt(g(id).replace(/\D/g, ''), 10); };
    var name = g('np-name'), price = num('np-price');
    if (!name) { toast('Escribe el nombre del producto'); return; }
    if (!(price > 0)) { toast('Escribe el precio'); return; }
    var cat = $('#np-cat').value;
    P.push({ id:nextId(), name:name, size:g('np-size') || 'Unidad', cat:cat, price:price, stock:num('np-stock') || 0, min:num('np-min') || 0, shape:CAT_SHAPE[cat] || 'liq', c:DEF_COLOR[cat] || '#8C5A1A', l:'#D0432E', s30:0, s7:0, sub:g('np-sub'), old:0, img:S.newImg || '' });
    S.newImg = ''; toast('Producto agregado: ' + name); redrawTab();
  },
  'alegra-test':function(){ alegraTest(); },
  'push-on':function(){ Push.enable(); },
  'push-off':function(){ Push.disable(); },
  'push-test':function(){ Push.test(); },
  'alegra-import':function(){ alegraImport(); },
  'alegra-sync':function(){ alegraSyncAll(); },
  'notif-test':function(){ notifyNewOrder({ code:'MB-PRUEBA' }, true); toast(DEMO_MODE ? 'Aviso de prueba enviado (simulado)' : 'Si no lo oíste, sube el volumen del equipo'); },
  repay:function(el){ var o = ORDERS.filter(function(x){ return x.code === el.dataset.code; })[0]; if (o) { toast('Abriendo el pago…'); payWithWompi(o); } },
  'copy-csv':function(){ copyText(csvDia()); },
  'copy-res':function(){ copyText($('#restxt').value, $('#restxt')); },
  'rider-add':function(){ var v = ($('#newrider').value || '').trim(); if (v && S.set.riders.indexOf(v) < 0) { S.set.riders.push(v); toast('Domiciliario agregado'); redrawTab(); } },
  'rider-rm':function(el){ S.set.riders = S.set.riders.filter(function(r){ return r !== el.dataset.name; }); redrawTab(); }
};

document.addEventListener('click', function(e){
  if (e.target.closest('nav.main a')) document.body.classList.remove('menu-open');
  if (!e.target.closest('.hsearch') && !e.target.closest('#sug')) { var sg = $('#sug'); if (sg) sg.hidden = true; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var fn = A[el.dataset.act]; if (fn) { fn(el, e); Store.touch(); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { closeCart(); closeModal(); document.body.classList.remove('menu-open'); var sg = $('#sug'); if (sg) sg.hidden = true; }
  if (e.key === 'Enter' && e.target.id === 'tcode') A.track();
  if (e.key === 'Enter' && (e.target.id === 'pin' || e.target.id === 'pemail')) A.login();
});
/* Formulario de pago: guarda lo que escribe la persona */
function onField(e){
  var el = e.target, k = el.dataset.f; if (!k) return;
  S.form[k] = el.type === 'checkbox' ? el.checked : el.value;
  if (k === 'mode' || k === 'zone' || k === 'pay') syncCheckout();
}
document.addEventListener('input', function(e){
  onField(e);
  if (e.target.id === 'hq') { S.hq = e.target.value; suggest(e.target.value); }
  if (e.target.id === 'q') { S.q = e.target.value; refreshGrids(); }
  if (e.target.id === 'prodq') { S.prodQ = e.target.value; $('#prodbody').innerHTML = prodRows(); }
  if (e.target.id === 'invq') { S.invQ = e.target.value; $('#invbody').innerHTML = invRows(); }
});
/* Cambios del panel (precios, ajustes, interruptores) */
var CHG = {
  open:function(el){ S.set.open = el.checked; el.nextElementSibling.textContent = S.set.open ? 'Recibiendo pedidos' : 'Pedidos pausados'; drawTop(); toast(S.set.open ? 'La tienda está recibiendo pedidos' : 'Pedidos pausados. La tienda muestra “cerrado”.'); },
  rider:function(el){ findOrder(el.dataset.code).rider = el.value; toast(el.value ? 'Asignado a ' + el.value : 'Sin domiciliario'); },
  price:function(el){ var p = byId(+el.dataset.id), v = parseInt(el.value.replace(/\D/g, ''), 10); if (v >= 0) { p.price = v; if (p.old && p.old <= p.price) p.old = 0; toast('Precio actualizado'); } $('#invbody').innerHTML = invRows(); },
  old:function(el){
    var p = byId(+el.dataset.id), v = parseInt(el.value.replace(/\D/g, ''), 10);
    if (!el.value.trim()) { p.old = 0; toast('Oferta quitada'); }
    else if (v > p.price) { p.old = v; toast('Oferta activada: -' + pct(p) + '%'); }
    else toast('El precio de antes debe ser mayor al precio actual');
    el.value = p.old || '';
  },
  prodvis:function(el){ byId(+el.dataset.id).hidden = !el.checked; el.nextElementSibling.textContent = el.checked ? 'Visible' : 'Oculto'; toast(el.checked ? 'El producto se ve en la tienda' : 'El producto quedó oculto'); },
  'slide-secs':function(el){ var s = slideById(el.dataset.id); s.secs = Math.max(2, Math.min(60, parseInt(el.value, 10) || 6)); el.value = s.secs; var sm = $('#adsum'); if (sm) sm.innerHTML = adSummary(); toast('Se muestra ' + s.secs + ' segundos'); },
  'slide-on':function(el){ slideById(el.dataset.id).on = el.checked; redrawTab(); },
  'slide-link':function(el){ slideById(el.dataset.id).link = el.value; toast('Enlace guardado'); },
  sched:function(el){
    var v = el.value.split(':'), m = (+v[0]) * 60 + (+v[1] || 0), k = el.dataset.key;
    if (isNaN(m)) return;
    if (k === 'closeLate' && m < 12 * 60) m += 1440;
    S.set[k] = m; el.value = toTime(m); toast('Horario guardado'); drawTop(); drawFoot();
  },
  respect:function(el){ S.set.respectSched = el.checked; drawTop(); toast(el.checked ? 'La tienda se cierra sola fuera del horario' : 'La tienda ya no se cierra por horario'); },
  wompi:function(el){ S.set.wompi = el.checked; drawFoot(); toast(el.checked ? 'Pago en línea activado' : 'Pago en línea apagado: solo efectivo'); },
  festivos:function(el){ S.set.festivos = (el.value.match(/\d{4}-\d{2}-\d{2}/g) || []); toast('Festivos guardados (' + S.set.festivos.length + ')'); drawTop(); drawFoot(); },
  alegra:function(el){ var k = el.dataset.key; if (k === 'token') { if (el.value.indexOf('•') < 0) S.alegra.token = el.value.trim(); el.value = S.alegra.token ? '••••••••••••' : ''; } else { S.alegra.email = el.value.trim(); S.alegra.clientId = ''; } S.alegra.connected = false; var st = $('#al-status'); if (st) { st.className = 'pill warn'; st.textContent = 'Sin conectar'; } },
  alegraopt:function(el){ S.alegra[el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value; toast('Guardado'); },
  alegraid:function(el){ var p = byId(+el.dataset.id), v = parseInt(el.value.replace(/\D/g, ''), 10); if (v > 0) p.alegraId = v; else delete p.alegraId; el.value = p.alegraId || ''; toast(p.alegraId ? 'Enlazado con Alegra (código ' + p.alegraId + ')' : 'Sin enlace con Alegra'); },
  notif:function(el){ var k = el.dataset.key; S.notif[k] = el.type === 'checkbox' ? el.checked : el.value.trim(); toast('Guardado'); },
  min:function(el){ var p = byId(+el.dataset.id); p.min = Math.max(0, parseInt(el.value, 10) || 0); el.value = p.min; $('#invtiles').innerHTML = invTiles(); var tb = $('.ptabs button[data-tab="inventario"]'); if (tb) tb.innerHTML = 'Inventario' + tabBadge('inventario'); toast('Te avisamos cuando queden ' + p.min + ' o menos'); },
  invlow:function(el){ S.invLow = el.checked; $('#invbody').innerHTML = invRows(); },
  autosync:function(el){ S.autoSync = el.checked; toast(el.checked ? 'Cada venta nueva se envía sola' : 'Envío automático apagado'); },
  set:function(el){ var k = el.dataset.key; S.set[k] = (k === 'minOrder' || k === 'freeFrom') ? (parseInt(el.value.replace(/\D/g, ''), 10) || 0) : el.value.trim(); if (typeof S.set[k] === 'number') el.value = S.set[k]; drawFoot(); toast('Guardado'); },
  zone:function(el){ var z = zoneOf(el.dataset.id), k = el.dataset.key; z[k] = k === 'fee' ? (parseInt(el.value.replace(/\D/g, ''), 10) || 0) : el.value.trim(); if (k === 'fee') el.value = z.fee; toast('Guardado'); }
};
function moveSlide(id, d){
  var i = S.slides.map(function(s){ return s.id; }).indexOf(id), j = i + d;
  if (i < 0 || j < 0 || j >= S.slides.length) return;
  var t = S.slides[i]; S.slides[i] = S.slides[j]; S.slides[j] = t; redrawTab();
}
function setPrev(sel, url){ var el = $(sel); if (el) el.innerHTML = '<img src="' + url + '" alt="">'; }
function onImage(el){
  var k = el.dataset.img, max = k === 'ad' ? 1920 : k === 'adm' ? 1200 : 700;
  readImage(el.files[0], max, function(url){
    el.value = '';
    if (!url) { toast('No pude leer esa imagen. Prueba con JPG o PNG.'); return; }
    if (k === 'np') { S.newImg = url; setPrev('#np-prev', url); }
    else if (k === 'prod') { byId(+el.dataset.id).img = url; toast('Foto actualizada'); $('#prodbody').innerHTML = prodRows(); Store.touch(); }
    else if (k === 'ad') { S.adNew.img = url; setPrev('#ad-prev', url); }
    else if (k === 'adm') { S.adNew.imgM = url; setPrev('#adm-prev', url); }
  });
}
document.addEventListener('change', function(e){
  if (e.target.type === 'file' && e.target.files && e.target.files[0]) { onImage(e.target); return; }
  onField(e);
  var k = e.target.dataset.chg; if (k && CHG[k]) { CHG[k](e.target); Store.touch(); }
  if (e.target.id === 'sort') { S.sort = e.target.value; refreshGrids(); }
});
document.addEventListener('submit', function(e){
  if (e.target.id !== 'hform') return;
  e.preventDefault();
  runSearch($('#hq').value);
  setTimeout(function(){ var q = $('#q'); if (q && !S.q) q.focus(); }, 80);
});
setInterval(function(){ var t = cdText(); $$('.cd').forEach(function(el){ el.textContent = t; }); }, 1000);
window.addEventListener('hashchange', go);
var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ if (S.route === 'panel' && S.tab === 'resumen') hourChart(); }, 150); });

/* ---------- Arranque ---------- */
function lockMinor(){
  $('#age-form').hidden = true;
  var m = $('#age-msg'); m.textContent = 'Lo sentimos, no puedes entrar a esta tienda. Debes ser mayor de 18 años.'; m.hidden = false;
}
function buildDob(){
  var y = new Date().getFullYear(), i, h = '<option value="">Día</option>';
  for (i = 1; i <= 31; i++) h += '<option value="' + i + '">' + i + '</option>';
  $('#dob-d').innerHTML = h;
  h = '<option value="">Mes</option>';
  MESES.forEach(function(m, k){ h += '<option value="' + (k + 1) + '">' + m.charAt(0).toUpperCase() + m.slice(1) + '</option>'; });
  $('#dob-m').innerHTML = h;
  h = '<option value="">Año</option>';
  for (i = y; i >= y - 100; i--) h += '<option value="' + i + '">' + i + '</option>';
  $('#dob-y').innerHTML = h;
}
$('#gate-logo').src = LOGO_L; $('#age-legal').textContent = LEGAL_SHORT; buildDob();
var ok = false, minor = false; try { ok = sessionStorage.getItem('mb-age') === '1'; minor = sessionStorage.getItem('mb-minor') === '1'; } catch (e) {}
$('#age').hidden = ok;
if (minor && !ok) lockMinor();
if (!DEMO_MODE && window.MBFB) {
  S.authChecking = true;
  window.MBFB.onAuth(function(u){
    S.authChecking = false;
    S.authed = !!(u && (u.email || '').toLowerCase() === S.set.adminEmail.toLowerCase());
    if (u && !S.authed) window.MBFB.signOut();
    if (S.authed) { Store.onAdmin(); Push.refresh(); } else Store.offAdmin();
    if (S.route === 'panel') go();
  });
}
Store.loadPublic();
(function(){
  var back = ''; try { back = sessionStorage.getItem('mb-pay') || ''; } catch (e) {}
  if (back && !DEMO_MODE) { S.trackCode = back; S.lastCode = back; S.justOrdered = null; try { sessionStorage.removeItem('mb-pay'); } catch (e) {} location.hash = '#rastrear'; Store.track(back).then(function(){ if (S.route === 'rastrear') $('#view').innerHTML = vRastrear(); }).catch(function(){}); }
})();
if (!DEMO_MODE) {
  setInterval(function(){ var n = new Date(); S.clock = n.getHours() * 60 + n.getMinutes(); Store.rebuild(); }, 60000);
  var lastPoll = 0;
  setInterval(function(){
    if (S.route !== 'rastrear' || !S.trackCode || S.authed) return;
    var cur = ORDERS.filter(function(x){ return x.code === S.trackCode; })[0], wait = cur && unpaid(cur) ? 6000 : 30000;
    if (Date.now() - lastPoll < wait - 500) return;
    var t = $('#tcode'); if (t && document.activeElement === t) return;
    lastPoll = Date.now();
    Store.track(S.trackCode).then(function(){ var t2 = $('#tcode'); if (S.route === 'rastrear' && !(t2 && document.activeElement === t2)) $('#view').innerHTML = vRastrear(); }).catch(function(){});
  }, 3000);
}
go();

})();
